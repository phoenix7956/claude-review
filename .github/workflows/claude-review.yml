name: Claude PR Review
description: Auto-review pull requests using Claude API

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install claude-review
        run: npm install -g @phoenix7956/claude-review
        # Note: publish to npm first, or use direct repo:
        # run: npm install -g github:phoenix7956/claude-review#v1

      - name: Run review and post comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude-review \
            "${{ github.event.pull_request.html_url }}" \
            --post \
            --model=claude-sonnet-4-20250514
